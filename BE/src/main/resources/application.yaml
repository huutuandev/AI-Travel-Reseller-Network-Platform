spring:
  # 1. Cấu hình kết nối PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: root
    password: rootpassword
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate/JPA cho PostgreSQL
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng. (Lưu ý: Không nên dùng 'update' trên môi trường Production)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 2. Cấu hình kết nối Redis
  data:
    redis:
      host: localhost
      port: 6379
      # password: yourpassword # Bỏ comment nếu bạn có cài mật khẩu ở file docker-compose

  # 3. Cấu hình kết nối RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: rootpassword

server:
  port: 8080 # Port của ứng dụng Spring Boot