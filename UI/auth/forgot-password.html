<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset password · Wayfarer Network</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script defer src="../shared/scripts.js"></script>
</head>

<body class="auth-body">
    <aside class="auth-aside"><a class="brand" href="../index.html"><span class="brand-mark">✦</span> Wayfarer
            Network</a>
        <div>
            <div class="eyebrow">Account access</div>
            <h1>A fresh start is just one step away.</h1>
            <p>Enter your account email to preview the password reset request flow.</p>
        </div><small class="muted">Static demonstration · No email will be sent</small>
    </aside>
    <main class="auth-box"><a class="brand" href="../index.html"><span class="brand-mark">✦</span> Wayfarer Network</a>
        <h2>Forgot your password?</h2>
        <p>We’ll show a demo confirmation after you submit.</p>
        <form data-demo-form>
            <div class="form-field"><label>Email address</label><input type="email" placeholder="you@example.com"
                    required></div><button type="submit">Request reset link</button>
            <p data-feedback class="hint"></p>
        </form>
        <p><a href="login.html">← Back to sign in</a></p>
    </main>
</body>

</html>
