version: '3.8'

services:
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: ai-travel-fe
    ports:
      - "3000:3000"
    volumes:
      - ./FE:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    # Override CMD to run in dev mode with hot-reload
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - backend

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: ai-travel-be
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://postgres_db:5432/mydatabase
      - REDIS_HOST=redis_cache
      - RABBITMQ_HOST=rabbitmq_broker
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # Port giao tiếp mặc định của ứng dụng
      - "15672:15672" # Port truy cập giao diện web quản lý (Management UI)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
